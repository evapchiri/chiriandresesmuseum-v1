<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Chiriandreses Museum</title>
  <meta name="description"
    content="How the Chiriandreses Museum project came to be, the process behind it, and where to find the full documentation.">
  <link rel="stylesheet" href="assets/styles.css">
  {{THEME_INIT}}
</head>

<body>

  {{THEME_TOGGLE}}

  {{HERO}}

  <main class="wrap about-main">

    <div class="about-layout">
      <button type="button" class="about-nav-toggle" aria-controls="about-nav" aria-expanded="false">Explore the
        project</button>
      <div class="about-nav-dialog">
        <nav class="about-nav" id="about-nav" aria-label="About page sections" role="tablist">
          <button type="button" id="tab-intro" class="active" data-panel="intro" role="tab" aria-selected="true"
            aria-controls="panel-intro">What is Chiriandreses Museum?</button>
          <button type="button" id="tab-about-me" data-panel="about-me" role="tab" aria-selected="false"
            aria-controls="panel-about-me">About me</button>

          <p class="about-nav-group" role="presentation">The project</p>
          <button type="button" id="tab-lifecycle" data-panel="lifecycle" role="tab" aria-selected="false"
            aria-controls="panel-lifecycle">Project lifecycle</button>
          <button type="button" id="tab-stage-by-stage" data-panel="stage-by-stage" role="tab" aria-selected="false"
            aria-controls="panel-stage-by-stage">Stage-by-stage</button>
          <button type="button" id="tab-documentation" data-panel="documentation" role="tab" aria-selected="false"
            aria-controls="panel-documentation">Project archive</button>

          <p class="about-nav-group" role="presentation">My journey</p>
          <button type="button" id="tab-lab-notes" data-panel="lab-notes" role="tab" aria-selected="false"
            aria-controls="panel-lab-notes">Lab journal</button>
          <button type="button" id="tab-lessons" data-panel="lessons" role="tab" aria-selected="false"
            aria-controls="panel-lessons">Lessons learned</button>
        </nav>
        <button type="button" class="about-nav-close" aria-label="Close menu">&times;</button>
      </div>

      <div class="about-content">

        <section id="panel-intro" data-panel-content="intro" role="tabpanel" aria-labelledby="tab-intro" tabindex="-1">
          {{ABOUT_INTRO}}
        </section>

        <section id="panel-about-me" data-panel-content="about-me" role="tabpanel" aria-labelledby="tab-about-me" hidden
          tabindex="-1">
          {{ABOUT_ME}}
        </section>

        <section id="panel-lifecycle" data-panel-content="lifecycle" role="tabpanel" aria-labelledby="tab-lifecycle"
          hidden tabindex="-1">
          {{LIFECYCLE}}
        </section>

        <section id="panel-stage-by-stage" data-panel-content="stage-by-stage" role="tabpanel"
          aria-labelledby="tab-stage-by-stage" hidden tabindex="-1">
          {{STAGE_BY_STAGE}}
        </section>

        <section id="panel-documentation" data-panel-content="documentation" role="tabpanel"
          aria-labelledby="tab-documentation" hidden tabindex="-1">
          {{DOCUMENTATION}}
        </section>

        <section id="panel-lab-notes" data-panel-content="lab-notes" role="tabpanel" aria-labelledby="tab-lab-notes"
          hidden tabindex="-1">
          {{LAB_NOTES}}
        </section>

        <section id="panel-lessons" data-panel-content="lessons" role="tabpanel" aria-labelledby="tab-lessons" hidden
          tabindex="-1">
          {{LESSONS_LEARNED}}
        </section>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      {{FOOTER_META}}
    </div>
  </footer>

  <script src="assets/site.js"></script>
</body>

</html>
