name: Build docs

# Keeps /docs in sync with source automatically, since GitHub Pages here is
# still set up as "Deploy from a branch: main / docs" (see README.md) — no
# need to touch that Pages setting, this just automates the "npm run build,
# commit /docs" step that would otherwise be manual on every push.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit rebuilt docs, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && exit 0
          git commit -m "Rebuild docs [skip ci]"
          git push
